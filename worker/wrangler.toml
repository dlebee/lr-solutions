name = "lr-contact"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

# Optional: serve at https://api.lr-solutions.com instead of *.workers.dev
# (requires the lr-solutions.com zone to be on Cloudflare DNS).
# routes = [{ pattern = "api.lr-solutions.com", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://lr-solutions.com,https://www.lr-solutions.com"
MAIL_FROM = "website@lr-solutions.com"
MAIL_FROM_NAME = "L&R Solutions Website"

# Cloudflare Email Routing binding (free). Only verified destination addresses can receive.
# Recipients come from the MAIL_TO / MAIL_CC secrets, so no addresses live in this repo.
[[send_email]]
name = "SEND_EMAIL"
